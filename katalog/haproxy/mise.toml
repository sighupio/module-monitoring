[tasks.upgrade]
usage = '''
arg "<rules_version>" help="Prometheus rules version"
arg "<dashboard_version>" help="Grafana dashboard version"
'''
run = '''
echo "Using rules version ${usage_rules_version}"
echo "Using dashboard version ${usage_dashboard_version}"

# --- Rules ---
GROUPS_FILE=$(mktemp -p /tmp)
wget -q "https://raw.githubusercontent.com/samber/awesome-prometheus-alerts/refs/tags/${usage_rules_version}/dist/rules/haproxy/embedded-exporter-v2.yml" -O "${GROUPS_FILE}"
echo "Downloaded rules from upstream"

yq -i '.groups[].rules |= map(select(.alert != "HaproxyHttpSlowingDown"))' "${GROUPS_FILE}"
echo "Filtered out HaproxyHttpSlowingDown rule"

yq -i ".spec.groups = load(\"$GROUPS_FILE\").groups" rules/haproxy-rules.yaml
rm -f "$GROUPS_FILE"
echo "Prometheus rule updated"

# --- Dashboard ---
DASHBOARD_FILE=$(mktemp -p /tmp)
wget -q "https://grafana.com/api/dashboards/12693/revisions/${usage_dashboard_version}/download" -O "${DASHBOARD_FILE}"

SED_FILE=$(mktemp -p /tmp)
sed 's/DS_PROMETHEUS/datasource/g' "${DASHBOARD_FILE}" > "${SED_FILE}"

JQ_FILE=$(mktemp -p /tmp)
jq '
  .templating.list |= map(
    if .name == "code" then
      .query.query = "label_values({__name__=~\"haproxy_.*_http_responses_total\", instance=\"$host\"}, code)"
    else . end
  )
' "${SED_FILE}" > "${JQ_FILE}"

rm -f dashboards/*.json
mv "${JQ_FILE}" "dashboards/12693_rev${usage_dashboard_version}.json"
rm $DASHBOARD_FILE $SED_FILE

yq -i ".configMapGenerator[0].files[0] = \"12693_rev${usage_dashboard_version}.json\"" dashboards/kustomization.yaml
echo "Downloaded and patched dashboards/12693_rev${usage_dashboard_version}.json"

mise //:add-license
'''